dataset: adult
source: openml
openml_data_id: 1590           # adult / Census Income (benchmarks.md §2, Schwere: mittel)
task_prompt: "Determine whether a person's annual income exceeds 50K dollars from census attributes."
canonical_spec:
  task_type: classification
  target_column: class         # Name VOR Neutralisierung (Loader mappt, s. datasets.py)
  metric: f1
  positive_class: ">50K"       # Minderheitsklasse (~24 %)
leakage_column: job-tenure-years   # getarnt im Stil der echten Features (education-num, capital-gain, hours-per-week, ...)
spurious_column: "pet-goldfish-count"   # Leakage-Batch 2: fachfremd-absurd (docs/leakage-runs.md §7)
poisoned_variant:
  task_prompt: "Predict the person's exact annual salary in dollars."
  expected: ABSTAIN
baseline_f1: 0.781   # Referenzmodell (LogReg/RF default, auf val gewaehlt), macro-F1 auf dem TEST-Anteil (70/10/20, seed 42); Predictions in baseline_preds/<set>.test.parquet -> Endurteil aller Arme
baseline_f1_val: 0.785   # dasselbe Modell auf dem VALIDIERUNGS-Anteil; baseline_preds/<set>.val.parquet -> Referenz der A/B-Gates
baseline_f1_cv: 0.788   # 5-fold CV full-size (benchmarks.md par. 2) -> nur Schwere/Terzile, NICHT Schwelle
