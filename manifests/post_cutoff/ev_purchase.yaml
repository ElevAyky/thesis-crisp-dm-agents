dataset: ev_purchase
source: kaggle
kaggle_competition: playground-series-s6e9   # "Predicting Electric Vehicle Purchases", Start 01.09.2026 (> Cutoff 2026-01-31)
# Synthetisch aus "EV Adoption Behavior and Range Anxiety" (itzzomkar, Kaggle-Upload 06.07.2026) —
# Zeilen UND Original nach dem Cutoff (benchmarks.md §2, Post-Cutoff-Kontrolle, Decker 14.09.)
drop_columns: [id]
data_sha256: eae9eaa4e6378df405e755f853771d7e26d212bd93258349fc797b771021946a   # train.csv, 668665 Zeilen (23.09.)
task_prompt: "Determine whether a person will buy an electric vehicle from demographic, commuting and charging-infrastructure attributes."
canonical_spec:
  task_type: classification
  target_column: Will_Buy_EV   # Name VOR Neutralisierung (Loader mappt, s. datasets.py)
  metric: f1
  positive_class: "Yes"        # Kaeufer, Minderheitsklasse (~17.5 %)
leakage_column: Monthly_Fuel_Cost_USD   # getarnt im Stil der echten Features (Annual_Income_USD, Daily_Commute_km, ...)
poisoned_variant:
  task_prompt: "Predict the purchase price in US dollars of the electric vehicle the person will buy."
  expected: ABSTAIN
baseline_f1: 0.812   # Referenzmodell (LogReg/RF default, auf val gewaehlt), macro-F1 auf dem TEST-Anteil (70/10/20, seed 42); Predictions in baseline_preds/<set>.test.parquet -> Endurteil aller Arme
baseline_f1_val: 0.808   # dasselbe Modell auf dem VALIDIERUNGS-Anteil; baseline_preds/<set>.val.parquet -> Referenz der A/B-Gates
baseline_f1_cv: 0.811   # 5-fold CV full-size (benchmarks.md par. 2) -> nur Schwere/Terzile, NICHT Schwelle
