dataset: cnae_9
source: openml
openml_data_id: 1468           # cnae-9 (benchmarks.md §2, Schwere: mittel-schwer, high-dim/sparse)
task_prompt: "Determine the economic activity category of a Brazilian company from the word-frequency vector of its business description."
canonical_spec:
  task_type: classification
  target_column: Class         # Name VOR Neutralisierung (Loader mappt, s. datasets.py)
  metric: f1
  positive_class: null         # multiclass (9 Kategorien) -> macro-F1
leakage_column: V857               # getarnt im Stil der echten Features (V1..V856)
spurious_column: "cheese_consumption"   # Leakage-Batch 2: fachfremd-absurd (docs/leakage-runs.md §7)
poisoned_variant:
  task_prompt: "Predict the company's annual revenue in Brazilian reais."
  expected: ABSTAIN
baseline_f1: 0.959   # Referenzmodell (LogReg/RF default, auf val gewaehlt), macro-F1 auf dem TEST-Anteil (70/10/20, seed 42); Predictions in baseline_preds/<set>.test.parquet -> Endurteil aller Arme
baseline_f1_val: 0.962   # dasselbe Modell auf dem VALIDIERUNGS-Anteil; baseline_preds/<set>.val.parquet -> Referenz der A/B-Gates
baseline_f1_cv: 0.942   # 5-fold CV full-size (benchmarks.md par. 2) -> nur Schwere/Terzile, NICHT Schwelle
