<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>crispfsm · Schaltzentrale</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --bg: #f4f6f8;
    --panel: #ffffff;
    --border: #d9dee4;
    --text: #1c2530;
    --muted: #6b7785;
    --accent: #2f6feb;
    --running: #2f6feb;
    --running-bg: #e6efff;
    --success: #1f9d55;
    --success-bg: #e3f5ea;
    --failed: #d23b3b;
    --failed-bg: #fbe6e6;
    --unknown: #7a828c;
    --unknown-bg: #e9ecef;
    --shadow: 0 1px 3px rgba(20,30,40,.08), 0 1px 2px rgba(20,30,40,.04);
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", "Roboto Mono", Menlo, Consolas, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: var(--sans);
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    line-height: 1.45;
  }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 20px 22px 60px; }

  header.app { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
  header.app h1 { font-size: 20px; margin: 0 0 2px; letter-spacing: -.2px; }
  header.app .sub { color: var(--muted); font-size: 13px; }

  .agg { display: flex; gap: 14px; flex-wrap: wrap; }
  .agg .stat {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 8px 14px; min-width: 92px; box-shadow: var(--shadow);
  }
  .agg .stat .k { font-size: 11px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); }
  .agg .stat .v { font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; }

  .panel {
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    padding: 16px 18px; margin-bottom: 18px; box-shadow: var(--shadow);
  }
  .panel h2 { font-size: 14px; margin: 0 0 12px; font-weight: 600; }

  /* new run form */
  .form-grid { display: flex; gap: 14px; flex-wrap: wrap; align-items: flex-end; }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field label { font-size: 12px; color: var(--muted); font-weight: 500; }
  .field select, .field input {
    font-family: var(--sans); font-size: 14px; padding: 7px 9px;
    border: 1px solid var(--border); border-radius: 8px; background: #fff; color: var(--text);
    min-width: 150px;
  }
  .field input[type=number] { min-width: 110px; }
  .field select:focus, .field input:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: var(--accent); }

  button {
    font-family: var(--sans); font-size: 14px; font-weight: 500; cursor: pointer;
    border: 1px solid var(--border); border-radius: 8px; padding: 8px 14px; background: #fff; color: var(--text);
  }
  button:hover { background: #f1f4f7; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover { background: #2559c9; }
  button.primary:disabled { opacity: .55; cursor: progress; }
  button.danger { background: var(--failed-bg); border-color: #f0c0c0; color: var(--failed); padding: 4px 10px; font-size: 12px; }
  button.danger:hover { background: #f7d4d4; }
  button.ghost { font-size: 13px; padding: 5px 11px; }

  .notice { margin-top: 12px; font-size: 13px; padding: 8px 12px; border-radius: 8px; }
  .notice.ok { background: var(--success-bg); color: var(--success); border: 1px solid #bfe6cd; }
  .notice.err { background: var(--failed-bg); color: var(--failed); border: 1px solid #f0c0c0; }
  .notice .rid { font-family: var(--mono); }
  .hidden { display: none !important; }

  /* toolbar */
  .toolbar { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 10px; }
  .toolbar .spacer { flex: 1; }
  .switch { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; color: var(--muted); cursor: pointer; user-select: none; }
  .switch input { width: 15px; height: 15px; accent-color: var(--accent); cursor: pointer; }
  .poll-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--unknown); display: inline-block; }
  .poll-dot.live { background: var(--success); }

  /* table */
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  thead th {
    text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .4px;
    color: var(--muted); font-weight: 600; padding: 8px 10px; border-bottom: 1px solid var(--border);
  }
  tbody td { padding: 9px 10px; border-bottom: 1px solid #eef1f4; vertical-align: middle; }
  tbody tr.run { cursor: pointer; }
  tbody tr.run:hover { background: #f6f9fc; }
  td.num { font-variant-numeric: tabular-nums; }
  .rid-cell { font-family: var(--mono); font-size: 12.5px; }
  .empty-row td { text-align: center; color: var(--muted); padding: 26px 10px; }

  /* badges */
  .badge {
    display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600;
    padding: 3px 10px; border-radius: 999px; text-transform: capitalize; white-space: nowrap;
  }
  .badge::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .badge.running { color: var(--running); background: var(--running-bg); }
  .badge.success { color: var(--success); background: var(--success-bg); }
  .badge.failed  { color: var(--failed);  background: var(--failed-bg); }
  .badge.unknown { color: var(--unknown); background: var(--unknown-bg); }

  /* detail */
  #detail .detail-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
  #detail .detail-head .rid { font-family: var(--mono); font-size: 15px; font-weight: 600; }
  .kpis { display: flex; gap: 12px; flex-wrap: wrap; margin: 6px 0 18px; }
  .kpi {
    background: #f7f9fb; border: 1px solid var(--border); border-radius: 9px;
    padding: 8px 13px; min-width: 96px;
  }
  .kpi .k { font-size: 11px; text-transform: uppercase; letter-spacing: .4px; color: var(--muted); }
  .kpi .v { font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums; }

  h3.sec { font-size: 13px; margin: 18px 0 10px; font-weight: 600; }

  /* events timeline */
  .timeline { display: flex; flex-direction: column; gap: 8px; }
  .event {
    display: grid;
    grid-template-columns: 30px 88px 1fr auto;
    gap: 6px 14px; align-items: start;
    border: 1px solid var(--border); border-left: 4px solid var(--unknown);
    border-radius: 9px; padding: 9px 13px; background: #fff;
  }
  .event.pass { border-left-color: var(--success); }
  .event.fail { border-left-color: var(--failed); background: #fdf4f4; }
  .event .ix { font-family: var(--mono); color: var(--muted); font-size: 12px; font-weight: 600; }
  .event .phase { font-weight: 600; text-transform: capitalize; }
  .event .meta { color: var(--muted); font-size: 12px; }
  .event .gate { font-weight: 700; font-size: 13px; white-space: nowrap; }
  .event .gate.pass { color: var(--success); }
  .event .gate.fail { color: var(--failed); }
  .event .feedback {
    grid-column: 2 / -1; margin-top: 4px; font-size: 12.5px; color: var(--failed);
    background: #fbe6e6; border-radius: 6px; padding: 5px 9px;
  }
  .event .tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 3px; }
  .tag {
    font-size: 11px; color: var(--muted); background: #eef1f4; border-radius: 5px; padding: 1px 7px;
    font-variant-numeric: tabular-nums;
  }
  .tag.resume { background: #e6efff; color: var(--accent); }

  /* artifacts */
  .artifacts { list-style: none; margin: 0; padding: 0; columns: 2; column-gap: 24px; }
  .artifacts li { font-family: var(--mono); font-size: 12.5px; color: var(--text); padding: 3px 0; break-inside: avoid; }
  .artifacts li::before { content: "\1F4C4  "; }
  .muted { color: var(--muted); }

  /* debug mode */
  .switch.debug { color: var(--accent); font-weight: 600; }
  .codeblock {
    font-family: var(--mono); font-size: 12px; line-height: 1.4;
    background: #0f1722; color: #d6e0ec; border: 1px solid #243246; border-radius: 8px;
    padding: 10px 12px; margin: 0; white-space: pre-wrap; word-break: break-word;
    overflow-x: auto; max-height: 360px; overflow-y: auto;
  }
  .event .debug {
    grid-column: 1 / -1; margin-top: 8px; padding-top: 10px;
    border-top: 1px dashed var(--border); display: flex; flex-direction: column; gap: 8px;
  }
  .event .debug .dlabel { font-size: 11px; text-transform: uppercase; letter-spacing: .4px; color: var(--muted); font-weight: 600; }
  .event .debug .dgrid { display: flex; gap: 6px; flex-wrap: wrap; }
  .event .debug .dgrid .tag { background: #eef1f4; }
  .collapsible > summary {
    cursor: pointer; font-size: 13px; font-weight: 600; padding: 6px 0; user-select: none;
    list-style: revert;
  }
  .collapsible[open] > summary { margin-bottom: 8px; }
  .artifacts li.clickable { cursor: pointer; color: var(--accent); text-decoration: underline; }
  .artifacts li.clickable:hover { color: #2559c9; }
  .file-viewer {
    margin-top: 12px; border: 1px solid var(--border); border-radius: 9px; padding: 12px 14px; background: #f7f9fb;
  }
  .file-viewer .fv-head { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; flex-wrap: wrap; }
  .file-viewer .fv-path { font-family: var(--mono); font-size: 12.5px; font-weight: 600; }
  .file-viewer .fv-note { font-size: 12px; color: var(--muted); }

  @media (max-width: 680px) {
    .artifacts { columns: 1; }
    .event { grid-template-columns: 26px 1fr; }
    .event .gate { grid-column: 2; }
    .event .debug { grid-column: 1 / -1; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="app">
    <div>
      <h1>crispfsm · Schaltzentrale</h1>
      <div class="sub">CRISP-DM FSM — Runs starten &amp; überwachen</div>
    </div>
    <div class="agg" data-testid="aggregate">
      <div class="stat"><div class="k">Runs</div><div class="v" data-testid="agg-total">–</div></div>
      <div class="stat"><div class="k">Running</div><div class="v" data-testid="agg-running">–</div></div>
      <div class="stat"><div class="k">Σ Kosten</div><div class="v" data-testid="agg-cost">–</div></div>
    </div>
  </header>

  <!-- New run -->
  <section class="panel">
    <h2>Neuen Run starten</h2>
    <form class="form-grid" data-testid="new-run-form" autocomplete="off">
      <div class="field">
        <label for="f-dataset">Dataset</label>
        <select id="f-dataset" data-testid="field-dataset">
          <option value="breast_cancer">breast_cancer</option>
          <option value="wine">wine</option>
        </select>
      </div>
      <div class="field">
        <label for="f-model">Modell</label>
        <select id="f-model" data-testid="field-model">
          <option value="claude-sonnet-4-6" selected>Sonnet 4.6 (default)</option>
          <option value="claude-haiku-4-5-20251001">Haiku 4.5 (günstigst)</option>
          <option value="claude-opus-4-8">Opus 4.8 (teuer)</option>
        </select>
      </div>
      <div class="field">
        <label for="f-threshold">eval_f1_threshold</label>
        <input id="f-threshold" data-testid="field-threshold" type="number" step="0.01" min="0" max="1" value="0.5">
      </div>
      <button type="submit" class="primary" data-testid="start-run">Run starten</button>
    </form>
    <div class="notice ok hidden" data-testid="start-notice"></div>
    <div class="notice err hidden" data-testid="start-error"></div>
  </section>

  <!-- Runs list -->
  <section class="panel" data-testid="runs-panel">
    <div class="toolbar">
      <h2 style="margin:0">Runs</h2>
      <span class="spacer"></span>
      <span class="switch"><span class="poll-dot live" data-testid="poll-dot"></span><span data-testid="last-refresh" class="muted">—</span></span>
      <label class="switch">
        <input type="checkbox" data-testid="autorefresh-toggle" checked> Auto-Refresh (2s)
      </label>
      <label class="switch debug" title="Mehr LLM-Output, Token-Details, Logs und Artefakt-Viewer einblenden">
        <input type="checkbox" data-testid="debug-toggle"> Debug-Modus (mehr LLM-Output &amp; Logs)
      </label>
      <button type="button" class="ghost" data-testid="refresh">Refresh</button>
    </div>
    <table>
      <thead>
        <tr>
          <th>Status</th><th>Run-ID</th><th>Dataset</th><th>Modell</th>
          <th>F1</th><th>Calls</th><th>Kosten</th><th>gestartet</th><th></th>
        </tr>
      </thead>
      <tbody data-testid="runs-table"></tbody>
    </table>
  </section>

  <!-- Detail -->
  <section class="panel hidden" id="detail" data-testid="run-detail">
    <div class="toolbar" style="margin-bottom:6px">
      <button type="button" class="ghost" data-testid="close-detail">← Zurück zur Liste</button>
      <span class="spacer"></span>
      <span class="muted" data-testid="detail-refresh">—</span>
    </div>
    <div class="detail-head">
      <span class="rid" data-testid="detail-runid"></span>
      <span data-testid="detail-badge"></span>
    </div>
    <div class="kpis" data-testid="detail-kpis"></div>

    <h3 class="sec">Events Timeline</h3>
    <div class="timeline" data-testid="events-timeline"></div>

    <details class="collapsible hidden" data-testid="run-log">
      <summary>Run-Log</summary>
      <pre class="codeblock" data-testid="run-log-content"></pre>
    </details>

    <h3 class="sec">Artefakte</h3>
    <ul class="artifacts" data-testid="artifacts"></ul>

    <div class="file-viewer hidden" data-testid="file-viewer">
      <div class="fv-head">
        <span class="fv-path" data-testid="file-viewer-path"></span>
        <span class="fv-note" data-testid="file-viewer-note"></span>
        <span class="spacer"></span>
        <button type="button" class="ghost" data-testid="file-viewer-close">Schließen</button>
      </div>
      <pre class="codeblock" data-testid="file-content"></pre>
    </div>
  </section>

</div>

<script>
(function () {
  "use strict";
  var API = "/api";
  var POLL_MS = 2000;

  // ---- model label map ----
  var MODEL_LABELS = {
    "claude-sonnet-4-6": "Sonnet 4.6",
    "claude-haiku-4-5-20251001": "Haiku 4.5",
    "claude-opus-4-8": "Opus 4.8"
  };

  var DEBUG_KEY = "crispfsm.debug";

  // ---- state ----
  var openRunId = null;     // currently open detail run, or null
  var pollTimer = null;
  var inFlightDetail = false;
  var lastRuns = [];        // cache of last runs list (status hints for detail badge)
  var lastDetail = null;    // cache of last-rendered detail payload (for debug re-render)
  var debugOn = false;      // verbose/debug mode

  function loadDebug() {
    try { return localStorage.getItem(DEBUG_KEY) === "1"; }
    catch (e) { return false; }
  }
  function saveDebug(on) {
    try { localStorage.setItem(DEBUG_KEY, on ? "1" : "0"); } catch (e) {}
  }

  // ---- dom refs ----
  var byTid = function (t) { return document.querySelector('[data-testid="' + t + '"]'); };

  var tbody        = byTid("runs-table");
  var detailEl     = byTid("run-detail");
  var aggTotal     = byTid("agg-total");
  var aggRunning   = byTid("agg-running");
  var aggCost      = byTid("agg-cost");
  var autoToggle   = byTid("autorefresh-toggle");
  var pollDot      = byTid("poll-dot");
  var lastRefresh  = byTid("last-refresh");
  var noticeOk     = byTid("start-notice");
  var noticeErr    = byTid("start-error");
  var startBtn     = byTid("start-run");
  var debugToggle  = byTid("debug-toggle");

  // ---- helpers ----
  function el(tag, cls, txt) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (txt != null) e.textContent = txt; // textContent => escaped by construction
    return e;
  }
  function fmtNum(v, dp) {
    if (v == null || v === "") return "–";
    var n = Number(v);
    if (isNaN(n)) return "–";
    return n.toFixed(dp);
  }
  function fmtCost(v) {
    if (v == null || isNaN(Number(v))) return "–";
    return "$" + Number(v).toFixed(2);
  }
  function fmtTs(v) {
    if (!v) return "–";
    var d;
    if (typeof v === "number") d = new Date(v * 1000);
    else d = new Date(v);
    if (isNaN(d.getTime())) return String(v);
    return d.toLocaleString("de-DE", { dateStyle: "short", timeStyle: "short" });
  }
  function statusClass(status) {
    if (status === "running" || status === "success" || status === "failed") return status;
    return "unknown";
  }
  // derive dataset from run_id prefix (everything before the last -<hex>)
  function deriveDataset(runId) {
    if (!runId) return "–";
    var m = /^(.*)-[0-9a-fA-F]+$/.exec(runId);
    return m ? m[1] : runId;
  }
  function datasetOf(run) {
    return run.dataset || deriveDataset(run.run_id);
  }
  function modelOf(run) {
    if (!run.model) return "–";
    return MODEL_LABELS[run.model] || run.model;
  }
  function makeBadge(status) {
    var s = statusClass(status);
    var b = el("span", "badge " + s, status || "unknown");
    b.setAttribute("data-testid", "status-badge");
    return b;
  }
  function detailStatusHint(runId, summary) {
    var hit = lastRuns.filter(function (r) { return r.run_id === runId; })[0];
    if (hit && hit.status) return hit.status;
    if (summary) return summary.success ? "success" : "failed";
    return "unknown";
  }

  // ---- runs table ----
  function renderRuns(runs) {
    tbody.textContent = "";

    if (!runs || runs.length === 0) {
      var tr = el("tr", "empty-row");
      var td = el("td", null, "Noch keine Runs — starte oben einen neuen Run.");
      td.colSpan = 9;
      tr.appendChild(td);
      tbody.appendChild(tr);
    } else {
      runs.forEach(function (run) {
        var tr = el("tr", "run");
        tr.setAttribute("data-testid", "run-row");
        tr.setAttribute("data-run-id", run.run_id);

        var tdStatus = el("td");
        tdStatus.appendChild(makeBadge(run.status));
        tr.appendChild(tdStatus);

        tr.appendChild(el("td", "rid-cell", run.run_id));
        tr.appendChild(el("td", null, datasetOf(run)));
        tr.appendChild(el("td", null, modelOf(run)));
        tr.appendChild(el("td", "num", fmtNum(run.final_f1, 3)));
        tr.appendChild(el("td", "num", run.total_calls == null ? "–" : String(run.total_calls)));
        tr.appendChild(el("td", "num", fmtCost(run.total_cost_usd)));
        tr.appendChild(el("td", "num", fmtTs(run.started_at)));

        var tdAct = el("td");
        if (run.status === "running") {
          var cancel = el("button", "danger", "Cancel");
          cancel.type = "button";
          cancel.setAttribute("data-testid", "cancel-run");
          cancel.addEventListener("click", function (ev) {
            ev.stopPropagation();
            cancelRun(run.run_id, cancel);
          });
          tdAct.appendChild(cancel);
        }
        tr.appendChild(tdAct);

        tr.addEventListener("click", function () { openDetail(run.run_id); });
        tbody.appendChild(tr);
      });
    }

    var total = runs ? runs.length : 0;
    var running = runs ? runs.filter(function (r) { return r.status === "running"; }).length : 0;
    var cost = runs ? runs.reduce(function (a, r) {
      var c = Number(r.total_cost_usd);
      return a + (isNaN(c) ? 0 : c);
    }, 0) : 0;
    aggTotal.textContent = String(total);
    aggRunning.textContent = String(running);
    aggCost.textContent = "$" + cost.toFixed(2);
  }

  // ---- detail view ----
  function kpi(k, v) {
    var box = el("div", "kpi");
    box.appendChild(el("div", "k", k));
    box.appendChild(el("div", "v", v));
    return box;
  }

  // Build the per-event verbose/debug block. Hidden via class unless debug is ON.
  function buildEventDebug(evt) {
    var wrap = el("div", "debug" + (debugOn ? "" : " hidden"));
    wrap.setAttribute("data-testid", "event-debug");

    // --- LLM output (worker_text) ---
    wrap.appendChild(el("div", "dlabel", "LLM-Output (worker_text)"));
    if (evt.worker_text != null && String(evt.worker_text) !== "") {
      var pre = el("pre", "codeblock");
      pre.setAttribute("data-testid", "worker-text");
      pre.textContent = String(evt.worker_text); // textContent => XSS-safe
      wrap.appendChild(pre);
    } else {
      var none = el("div", "muted", "kein worker_text (älterer Run)");
      none.setAttribute("data-testid", "worker-text");
      wrap.appendChild(none);
    }

    // --- meta details: turns, session, full tokens ---
    var grid = el("div", "dgrid");
    grid.appendChild(el("span", "tag",
      "agentische Schritte: " + (evt.worker_num_turns != null ? evt.worker_num_turns : "–")));
    if (evt.session_id != null && String(evt.session_id) !== "") {
      grid.appendChild(el("span", "tag", "session: " + String(evt.session_id)));
    }
    var u = evt.usage || {};
    grid.appendChild(el("span", "tag", "input: " + (u.input_tokens != null ? u.input_tokens : "–")));
    grid.appendChild(el("span", "tag", "output: " + (u.output_tokens != null ? u.output_tokens : "–")));
    grid.appendChild(el("span", "tag", "cache_read: " + (u.cache_read_tokens != null ? u.cache_read_tokens : "–")));
    grid.appendChild(el("span", "tag", "cache_creation: " + (u.cache_creation_tokens != null ? u.cache_creation_tokens : "–")));
    wrap.appendChild(grid);

    // --- gate metrics (pretty key:value list) ---
    var gm = evt.gate_metrics;
    if (gm && typeof gm === "object" && Object.keys(gm).length) {
      wrap.appendChild(el("div", "dlabel", "Gate-Metriken"));
      var gmGrid = el("div", "dgrid");
      Object.keys(gm).forEach(function (k) {
        var v = gm[k];
        if (v != null && typeof v === "object") v = JSON.stringify(v);
        gmGrid.appendChild(el("span", "tag", k + ": " + v));
      });
      wrap.appendChild(gmGrid);
    }

    return wrap;
  }

  function renderDetail(runId, data) {
    lastDetail = { runId: runId, data: data };
    var summary = data && data.summary;
    var events = (data && data.events) || [];
    var artifacts = (data && data.artifacts) || [];

    byTid("detail-runid").textContent = runId;
    var badgeHolder = byTid("detail-badge");
    badgeHolder.textContent = "";
    badgeHolder.appendChild(makeBadge(detailStatusHint(runId, summary)));

    var kpis = byTid("detail-kpis");
    kpis.textContent = "";
    if (summary) {
      kpis.appendChild(kpi("Success", summary.success === true ? "ja" : summary.success === false ? "nein" : "–"));
      kpis.appendChild(kpi("final F1", fmtNum(summary.final_f1, 3)));
      kpis.appendChild(kpi("Calls", summary.total_calls == null ? "–" : String(summary.total_calls)));
      kpis.appendChild(kpi("Kosten", fmtCost(summary.total_cost_usd)));
      var phases = Array.isArray(summary.visited_phases) ? summary.visited_phases.join(" → ") : "–";
      kpis.appendChild(kpi("Phasen", phases || "–"));
    } else {
      kpis.appendChild(kpi("Status", "läuft / keine Summary"));
    }

    var timeline = byTid("events-timeline");
    timeline.textContent = "";
    if (events.length === 0) {
      timeline.appendChild(el("div", "muted", "Noch keine Events."));
    } else {
      events.forEach(function (evt, i) {
        var passed = evt.gate_passed === true;
        var ev = el("div", "event " + (passed ? "pass" : "fail"));
        ev.setAttribute("data-testid", "event-row");

        ev.appendChild(el("div", "ix", "#" + (i + 1)));

        var mid1 = el("div");
        mid1.appendChild(el("span", "phase", evt.phase || "?"));
        ev.appendChild(mid1);

        var mid2 = el("div");
        mid2.appendChild(el("span", "meta", "Versuch " + (evt.attempt != null ? evt.attempt : "?")));
        var tags = el("div", "tags");
        if (evt.resume) tags.appendChild(el("span", "tag resume", "resume"));
        else tags.appendChild(el("span", "tag", "fresh"));
        var u = evt.usage || {};
        tags.appendChild(el("span", "tag", "in " + (u.input_tokens != null ? u.input_tokens : "–")));
        tags.appendChild(el("span", "tag", "out " + (u.output_tokens != null ? u.output_tokens : "–")));
        var lat = evt.latency_ms != null ? Math.round(evt.latency_ms) + " ms" : "– ms";
        tags.appendChild(el("span", "tag", lat));
        mid2.appendChild(tags);
        ev.appendChild(mid2);

        var gate = el("div", "gate " + (passed ? "pass" : "fail"), passed ? "✓ gate" : "✗ gate");
        ev.appendChild(gate);

        if (evt.gate_feedback) {
          ev.appendChild(el("div", "feedback", evt.gate_feedback));
        }

        ev.appendChild(buildEventDebug(evt));

        timeline.appendChild(ev);
      });
    }

    // --- run-log panel (debug only, non-null only) ---
    var logPanel = byTid("run-log");
    var logContent = byTid("run-log-content");
    var runLog = data && data.run_log;
    if (debugOn && runLog != null && String(runLog) !== "") {
      logContent.textContent = String(runLog); // textContent => XSS-safe
      logPanel.classList.remove("hidden");
    } else {
      logContent.textContent = "";
      logPanel.classList.add("hidden");
    }

    var artList = byTid("artifacts");
    artList.textContent = "";
    if (artifacts.length === 0) {
      var li = el("li", "muted", "keine Artefakte");
      li.style.fontFamily = "var(--sans)";
      artList.appendChild(li);
    } else {
      artifacts.forEach(function (a) {
        var item = el("li", null, a);
        item.setAttribute("data-testid", "artifact-item");
        item.setAttribute("data-path", a);
        if (debugOn) {
          item.classList.add("clickable");
          item.title = "Datei anzeigen";
          item.addEventListener("click", function () { viewFile(runId, a); });
        }
        artList.appendChild(item);
      });
    }

    // Hide stale file viewer on re-render (e.g. after toggling debug off or switching runs)
    if (!debugOn) hideFileViewer();
  }

  // ---- artifact file viewer (debug only) ----
  function hideFileViewer() {
    var fv = byTid("file-viewer");
    if (fv) fv.classList.add("hidden");
  }

  function viewFile(runId, path) {
    var fv = byTid("file-viewer");
    var pathEl = byTid("file-viewer-path");
    var noteEl = byTid("file-viewer-note");
    var contentEl = byTid("file-content");

    pathEl.textContent = path;
    noteEl.textContent = "lädt…";
    contentEl.textContent = "";
    fv.classList.remove("hidden");

    fetch(API + "/runs/" + encodeURIComponent(runId) + "/file?path=" + encodeURIComponent(path))
      .then(function (r) {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
      })
      .then(function (f) {
        noteEl.textContent = "";
        if (f && f.binary) {
          contentEl.textContent = "(binäre Datei, " + (f.size != null ? f.size : "?") + " Bytes — nicht anzeigbar)";
        } else {
          contentEl.textContent = (f && f.content != null) ? String(f.content) : ""; // textContent => XSS-safe
          if (f && f.truncated) noteEl.textContent = "(gekürzt)";
        }
      })
      .catch(function (e) {
        noteEl.textContent = "";
        contentEl.textContent = "Fehler beim Laden der Datei: " + e.message;
      });
  }

  function openDetail(runId) {
    openRunId = runId;
    detailEl.classList.remove("hidden");
    byTid("detail-runid").textContent = runId;
    byTid("detail-badge").textContent = "";
    byTid("detail-badge").appendChild(makeBadge(detailStatusHint(runId, null)));
    detailEl.scrollIntoView({ behavior: "smooth", block: "start" });
    fetchDetail(runId);
  }

  function closeDetail() {
    openRunId = null;
    detailEl.classList.add("hidden");
    hideFileViewer();
  }

  function fetchDetail(runId) {
    if (inFlightDetail) return;
    inFlightDetail = true;
    fetch(API + "/runs/" + encodeURIComponent(runId))
      .then(function (r) {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
      })
      .then(function (data) {
        if (openRunId === runId) {
          renderDetail(runId, data);
          byTid("detail-refresh").textContent = "aktualisiert " + new Date().toLocaleTimeString("de-DE");
        }
      })
      .catch(function (e) {
        if (openRunId === runId) {
          byTid("detail-refresh").textContent = "Fehler beim Laden: " + e.message;
        }
      })
      .then(function () { inFlightDetail = false; });
  }

  // ---- actions ----
  function cancelRun(runId, btn) {
    if (btn) { btn.disabled = true; btn.textContent = "…"; }
    fetch(API + "/runs/" + encodeURIComponent(runId) + "/cancel", { method: "POST" })
      .then(function (r) { return r.json().catch(function () { return {}; }); })
      .then(function () { fetchRuns(); })
      .catch(function () { if (btn) { btn.disabled = false; btn.textContent = "Cancel"; } });
  }

  function hide(node) { node.classList.add("hidden"); }
  function show(node) { node.classList.remove("hidden"); }

  function startRun(ev) {
    ev.preventDefault();
    hide(noticeOk); hide(noticeErr);
    var dataset = byTid("field-dataset").value;
    var model = byTid("field-model").value;
    var thrRaw = byTid("field-threshold").value;
    var threshold = thrRaw === "" ? null : Number(thrRaw);

    var payload = { dataset: dataset, model: model, eval_f1_threshold: threshold };

    startBtn.disabled = true;
    var prevLabel = startBtn.textContent;
    startBtn.textContent = "startet…";

    fetch(API + "/runs", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    })
      .then(function (r) {
        return r.json().catch(function () { return {}; }).then(function (body) {
          return { ok: r.ok, status: r.status, body: body };
        });
      })
      .then(function (res) {
        if (res.ok && res.body && res.body.run_id) {
          noticeOk.textContent = "Run gestartet: ";
          noticeOk.appendChild(el("span", "rid", res.body.run_id));
          show(noticeOk);
          fetchRuns(); // refresh immediately
        } else {
          var detail = (res.body && res.body.detail) ? res.body.detail : ("Fehler (HTTP " + res.status + ")");
          noticeErr.textContent = typeof detail === "string" ? detail : JSON.stringify(detail);
          show(noticeErr);
        }
      })
      .catch(function (e) {
        noticeErr.textContent = "Netzwerkfehler: " + e.message;
        show(noticeErr);
      })
      .then(function () {
        startBtn.disabled = false;
        startBtn.textContent = prevLabel;
      });
  }

  // ---- polling ----
  function fetchRuns() {
    return fetch(API + "/runs")
      .then(function (r) {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
      })
      .then(function (data) {
        var runs = (data && data.runs) || [];
        lastRuns = runs;
        renderRuns(runs);
        pollDot.classList.add("live");
        lastRefresh.textContent = "Stand " + new Date().toLocaleTimeString("de-DE");
        if (openRunId) fetchDetail(openRunId);
      })
      .catch(function (e) {
        pollDot.classList.remove("live");
        lastRefresh.textContent = "Verbindungsfehler (" + e.message + ")";
      });
  }

  function startPolling() {
    stopPolling();
    pollTimer = setInterval(function () {
      if (autoToggle.checked) fetchRuns();
    }, POLL_MS);
  }
  function stopPolling() {
    if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
  }

  // ---- wire up ----
  byTid("new-run-form").addEventListener("submit", startRun);
  byTid("refresh").addEventListener("click", function () { fetchRuns(); });
  byTid("close-detail").addEventListener("click", closeDetail);
  byTid("file-viewer-close").addEventListener("click", hideFileViewer);
  autoToggle.addEventListener("change", function () {
    pollDot.classList.toggle("live", autoToggle.checked);
    if (autoToggle.checked) fetchRuns();
  });

  // debug toggle: restore from localStorage, persist + re-render on change
  debugOn = loadDebug();
  debugToggle.checked = debugOn;
  debugToggle.addEventListener("change", function () {
    debugOn = debugToggle.checked;
    saveDebug(debugOn);
    // immediately re-render the currently open detail (no refetch needed — use cached payload)
    if (openRunId && lastDetail && lastDetail.runId === openRunId && lastDetail.data) {
      renderDetail(openRunId, lastDetail.data);
    } else if (openRunId) {
      fetchDetail(openRunId);
    }
  });

  // initial load + poll
  fetchRuns();
  startPolling();
})();
</script>
</body>
</html>
